name: Build game

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f *.zip *.tpz

      - name: Import project
        run: ./godot --headless --path . --import || true

      - name: Export Windows, Linux and macOS
        run: |
          mkdir -p build/windows build/linux build/macos
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/Greenfall.exe
          ./godot --headless --path . --export-release "Linux" build/linux/Greenfall.x86_64
          ./godot --headless --path . --export-release "macOS" build/macos/Greenfall.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Greenfall-Windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Greenfall-Linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: Greenfall-macOS
          path: build/macos
